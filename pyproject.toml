[project]
name = "audio-transcription-pipeline"
version = "0.1.0"
description = "Audio transcription pipeline using OpenAI Whisper, FastAPI, and a 3-tier architecture."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "openai-whisper>=20240930",
    "torch>=2.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
serve = "app.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
